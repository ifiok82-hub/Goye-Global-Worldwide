<!doctype html>

  <head>
    <script>
      const methods = ['log', 'warn', 'error'];
      methods.forEach(method => {
        const orig = console[method];
        console[method] = function(...args) {
          const str = args.map(a => String(a?.message || a)).join(' ');
          if (str.includes('[vite]')) return;
          orig.apply(console, args);
        };
      });
      window.addEventListener('error', e => {
        if (e.message && e.message.includes('[vite]')) e.preventDefault();
      });
    </script>

    <script>
      const originalError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
        originalError.apply(console, args);
      };
    </script>

    <!-- Paystack Inline Checkout SDK & Flutterwave Inline Checkout SDK v3 -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <script>
      window.payWithFlutterwave = function(productName, usdPrice){
        const customerEmail = prompt("Enter your email for instant delivery:");
        if(!customerEmail || !customerEmail.includes("@")){
          alert("Please enter valid email");
          return;
        }

        if (typeof FlutterwaveCheckout !== 'function') {
          alert("Flutterwave SDK is loading... Please wait a moment and click again.");
          return;
        }

        FlutterwaveCheckout({
          public_key: "FLWPUBK-cbb518a9b8f74421e887f4a1ec911ea7-X",
          tx_ref: "GOYE-FLW-"+Date.now(),
          amount: usdPrice,
          currency: "USD",
          payment_options: "card, banktransfer, ussd, account",
          customer: {
            email: customerEmail,
            name: "GOYE Customer",
          },
          customizations: {
            title: "Sirwise AI Web3 Academy Global",
            description: productName + " - Instant Delivery",
            logo: "https://www.gasv.store/goye-logo.svg",
          },
          callback: function(data){
            console.log(data);
            if(data.status === "successful" || data.status === "completed" || data.transaction_id){
              const txId = data.transaction_id || data.tx_ref || ("GOYE-TX-" + Date.now());
              const txRef = data.tx_ref || ("GOYE-FLW-" + Date.now());
              alert("✅ Payment Successful! Transaction: " + txId);
              localStorage.setItem("goye_order_"+txRef, JSON.stringify({email:customerEmail, product:productName, price:usdPrice, tx:txId, ref:txRef, status:"completed", date: new Date().toISOString()}));
              try {
                const stored = JSON.parse(localStorage.getItem('goye_unlocked_products') || '[]');
                if (!stored.includes(productName)) {
                  stored.push(productName);
                  localStorage.setItem('goye_unlocked_products', JSON.stringify(stored));
                }
              } catch(e) {}
              window.location.href = "success.html?email="+encodeURIComponent(customerEmail)+"&product="+encodeURIComponent(productName)+"&ref="+txRef+"&tx="+txId+"&gateway=Flutterwave";
            } else {
              alert("Payment not completed");
            }
          },
          onclose: function(){
            console.log("Flutterwave closed");
          }
        });
      };
    </script>
