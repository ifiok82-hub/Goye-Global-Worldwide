<script>
// GOYE Global - Pi GCV Machine & Multi-Currency Engine
// GCV Rate: 1 Pi = $314,159 GCV
window.GCV_RATE = 314159;
window.FX_RATES = { USD: 1, NGN: 1600, GBP: 0.78, EUR: 0.92 };
window.SELECTED_CURRENCY = localStorage.getItem('goye_currency') || 'USD';
window.CURRENCY_MODE = localStorage.getItem('goye_curr_mode') || 'pi'; // 'pi' or 'fiat'

window.PI_CONVERTER = {
  usdToPi: (usd) => (usd / window.GCV_RATE).toFixed(6).replace(/\.?0+$/, '') || '0.000001',
  piToUsd: (pi) => (pi * window.GCV_RATE).toFixed(2),
  
  getFiatValue: function(usd, curr) {
    const rate = window.FX_RATES[curr] || 1;
    const val = usd * rate;
    if (curr === 'NGN') return '₦' + Math.round(val).toLocaleString();
    if (curr === 'GBP') return '£' + val.toFixed(2);
    if (curr === 'EUR') return '€' + val.toFixed(2);
    return '$' + val.toFixed(2);
  },

  formatPrice: function(usd) {
    const pi = this.usdToPi(usd);
    const ngn = this.getFiatValue(usd, 'NGN');
    const gbp = this.getFiatValue(usd, 'GBP');
    const eur = this.getFiatValue(usd, 'EUR');
    const usdStr = '$' + usd.toFixed(2);
    
    const curr = window.SELECTED_CURRENCY || 'USD';
    const selFiat = this.getFiatValue(usd, curr);
    const mode = window.CURRENCY_MODE || 'pi';
    
    if (mode === 'pi') {
      return `<div class="flex flex-col"><span style="color:#FFD700; font-weight:800; font-size:15px;">${pi} Pi GCV</span><span style="color:#aaa; font-size:11px; font-weight:600;">(${usdStr} USD • ${ngn} • ${gbp} • ${eur})</span></div>`;
    } else {
      return `<div class="flex flex-col"><span style="color:#00FF88; font-weight:800; font-size:15px;">${selFiat} ${curr}</span><span style="color:#aaa; font-size:11px; font-weight:600;">${pi} Pi GCV (${usdStr} • ${ngn})</span></div>`;
    }
  },

  formatButton: function(usd) {
    const pi = this.usdToPi(usd);
    const curr = window.SELECTED_CURRENCY || 'USD';
    const selFiat = this.getFiatValue(usd, curr);
    const mode = window.CURRENCY_MODE || 'pi';
    
    if (mode === 'pi') {
      return `Buy & Unlock (${pi} Pi GCV)`;
    } else {
      return `Buy & Unlock (${selFiat} • ${pi} Pi)`;
    }
  }
};

window.convertAllPrices = function() {
  document.querySelectorAll('[data-usd-price]').forEach(el => {
    const usd = parseFloat(el.getAttribute('data-usd-price'));
    if (!isNaN(usd)) {
      el.innerHTML = PI_CONVERTER.formatPrice(usd);
    }
  });
  document.querySelectorAll('[data-usd-button]').forEach(btn => {
    const usd = parseFloat(btn.getAttribute('data-usd-button'));
    if (!isNaN(usd)) {
      btn.textContent = PI_CONVERTER.formatButton(usd);
    }
  });
};

window.changeCurrency = function(curr) {
  window.SELECTED_CURRENCY = curr;
  localStorage.setItem('goye_currency', curr);
  window.convertAllPrices();
};

window.toggleCurrencyMode = function() {
  window.CURRENCY_MODE = (window.CURRENCY_MODE === 'pi') ? 'fiat' : 'pi';
  localStorage.setItem('goye_curr_mode', window.CURRENCY_MODE);
  
  const btn = document.getElementById('toggleCurrencyModeBtn');
  if (btn) {
    btn.textContent = (window.CURRENCY_MODE === 'pi') ? '🟣 Pi GCV Mode' : '💵 Fiat Mode';

};

window.refreshPricesAndFx = async function() {
  const btn = document.getElementById('refreshPiPricesBtn');
  if (btn) btn.textContent = '⏳ Fetching Rates...';
  try {
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    if (res.ok) {
      const data = await res.json();
      if (data && data.rates) {
        window.FX_RATES.NGN = data.rates.NGN || 1600;
        window.FX_RATES.GBP = data.rates.GBP || 0.78;
        window.FX_RATES.EUR = data.rates.EUR || 0.92;
        console.log('✅ Live FX rates loaded:', window.FX_RATES);
      }
    }
  } catch(e) {
    console.warn('Using fallback FX rates:', e);
  }
  window.convertAllPrices();
  if (btn) btn.textContent = '🔄 Refresh Prices';

  if (typeof window.showToast === 'function') {
    window.showToast('✅ Prices Refreshed! 1 Pi = $314,159 GCV', 'success');
  }
};

window.showToast = function(msg, type = 'info') {
  const existing = document.getElementById('goyeGlobalToast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'goyeGlobalToast';
  const bgColor = (type === 'success') ? '#00AA00' : (type === 'error') ? '#DC2626' : '#7D2AE7';
  
  toast.style.cssText = `position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:${bgColor}; color:white; padding:12px 24px; border-radius:14px; z-index:9999999; font-weight:bold; font-size:13px; border:2px solid #FFD700; box-shadow:0 8px 25px rgba(0,0,0,0.8); text-align:center; max-width:90vw;`;
  toast.innerHTML = msg;
  document.body.appendChild(toast);

  setTimeout(() => {
    if (toast.parentElement) toast.remove();
  }, 3200);
};

window.loginWithPi = async function() {
  const btn = document.getElementById('loginWithPiBtn');
  if (btn) { btn.innerHTML = '⏳ Connecting...'; btn.disabled = false; btn.style.pointerEvents = 'auto'; }
  const inPiBrowser = isPiBrowser();
  
  if (!inPiBrowser && typeof Pi === 'undefined') {
    if (btn) { btn.innerHTML = '🟣 Connect Pi Wallet'; }
    if (typeof showPiGuideReal === 'function') showPiGuideReal();
    return;
  }
  
  if (!piReady) {
    initPiSDK();
    await new Promise(r => setTimeout(r, 1200));
  }
  
  if (typeof Pi === 'undefined') {
    if (btn) { btn.innerHTML = '🟣 Connect Pi Wallet'; }
    showToast('Pi SDK loading... Open gasv.store in Pi Browser app', 'info');
    return;
  }
  
  try {
    const auth = await Pi.authenticate(['username', 'payments'], function(p) {
      console.log('Incomplete payment', p);
      if (p && p.identifier) {
        fetch('/api/pi-complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId: p.identifier, txid: p.txid || 'incomplete' })
        }).catch(() => {});
      }
    });
    
    const username = auth.user.username;
    localStorage.setItem('pi_username', username);
    localStorage.setItem('user_email', username.toLowerCase() + '@pi.network');
    localStorage.setItem('pi_access_token', auth.accessToken);
    localStorage.setItem('is_pi_user', 'true');
    
    try {
      let c = JSON.parse(localStorage.getItem('registered_customers') || '[]');
      const email = username.toLowerCase() + '@pi.network';
      if (!c.some(x => x.email === email)) {
        c.unshift({
          name: username,
          email: email,
          pupil_name: username,
          parent: 'Pi Network',
          date: new Date().toLocaleDateString('en-GB'),
          date_wat: new Date().toLocaleString('en-GB', { timeZone: 'Africa/Lagos' }) + ' WAT Lagos',
          country: 'Pi Network GCV $314,159'
        });
        localStorage.setItem('registered_customers', JSON.stringify(c.slice(0, 500)));
        let lc = parseInt(localStorage.getItem('lead_submissions') || '0') || 0;
        localStorage.setItem('lead_submissions', (lc + 1).toString());
      }
    } catch(e) {}
    
    if (btn) { btn.innerHTML = '✅ @' + username; btn.style.background = '#00AA00'; }
    showToast('✅ Welcome @' + username + '! Connected to Pi Network', 'success');
  } catch(e) {
    console.error(e);
    if (btn) { btn.innerHTML = '🟣 Connect Pi Wallet'; btn.style.background = '#7D2AE7'; }
    const m = (e.message || '').toLowerCase();
    if (m.includes('cancel') || m.includes('denied') || m.includes('dismiss')) return;
    if (m.includes('incomplete') || m.includes('pending')) {
      showToast('Incomplete Pi payment blocking. Go to minepi.com -> My Payments -> Cancel incomplete', 'error');
      return;
    }
    if (inPiBrowser) {
      showToast('Tap Connect Pi Wallet again & approve pop-up in Pi Browser', 'info');
    } else {
      if (typeof showPiGuideReal === 'function') showPiGuideReal();
    }
  }
};

window.createPiPayment = async function(inputAmount, itemTitle) {
  let piAmount, usdAmount;
  itemTitle = itemTitle || "Pi Network Testnet Payment";
  if (!inputAmount) {
    piAmount = 0.01;
    usdAmount = 3141.59;
  } else if (typeof inputAmount === 'number' && inputAmount < 1) {
    piAmount = inputAmount;
    usdAmount = piAmount * (window.GCV_RATE || 314159);
  } else {
    usdAmount = parseFloat(inputAmount) || 49.99;
    piAmount = parseFloat((usdAmount / (window.GCV_RATE || 314159)).toFixed(6));
  }
  if (piAmount <= 0) piAmount = 0.01;

  if (typeof Pi === 'undefined') {
    showToast('Pay with Pi is active inside Pi Browser app. Opening Pi guide...', 'info');
    if (typeof showPiGuideReal === 'function') showPiGuideReal();
    return;
  }

  const userEmail = localStorage.getItem('user_email') || localStorage.getItem('customer_email') || 'piuser@gasv.store';

  try {
    const paymentData = {
      amount: piAmount,
      memo: "GOYE Global " + itemTitle + " - RC BN3583773 - gasv.store",
      metadata: { usd: usdAmount, pi: piAmount, gcv: window.GCV_RATE || 314159, store: "gasv.store", rc: "BN3583773", email: userEmail, product: itemTitle }
    };

    const callbacks = {
      onReadyForServerApproval: async function(id) {
        console.log('[Pi SDK index.html] Approval requested for paymentId:', id);
        try {
          const r = await fetch('/api/pi/approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: id, environment: 'testnet' })
          });
          const resData = await r.json();
          console.log('[Pi SDK index.html] Approval response:', resData);
        } catch(e) { console.error('[Pi SDK Approval Error]', e); }
      },
      onReadyForServerCompletion: async function(id, txid) {
        console.log('[Pi SDK index.html] Completion requested for paymentId:', id, 'txid:', txid);
        try {
          const r = await fetch('/api/pi/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: id, txid: txid, email: userEmail, productName: itemTitle, amount: piAmount, environment: 'testnet' })
          });
          const d = await r.json();
          console.log('[Pi SDK index.html] Completion response:', d);
          if (d.completed || d.status === 'PAID') {
            showToast('✅ Pi Payment Completed! ' + piAmount + ' Pi - TxID: ' + txid, 'success');
            localStorage.setItem("sirwise_paid", "true");
            localStorage.setItem("academy_unlocked", "true");
            window.location.hash = '#academy';
          }
        } catch(e) { console.error('[Pi SDK Completion Error]', e); }
      },
      onCancel: function(id) {
        console.log('[Pi SDK index.html] Payment cancelled by user:', id);
        if (id) {
          fetch('/api/pi/cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: id, environment: 'testnet' })
          }).catch(() => {});
        }
      },
      onError: function(err, payment) {
        console.error('[Pi SDK index.html] Payment error:', err, payment);
        const errMsg = (err && (err.message || err.toString())) || '';
        showToast('Pi Payment Note: ' + (errMsg || 'Network timeout handled'), 'info');
        const pid = (payment && payment.identifier) || (err && err.paymentId);
        if (pid) {
          fetch('/api/pi/cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: pid, environment: 'testnet' })
          }).catch(() => {});
        }
      }
    };
    await Pi.createPayment(paymentData, callbacks);
  } catch(e) { console.error('Pi createPayment exception:', e); showToast('Pi payment error: ' + (e.message || e), 'error'); }
};

    const v = localStorage.getItem(k);
    if (!v || v === 'NaN' || v === 'undefined' || v === 'null' || v === '') return fb;
    if (fb instanceof Array && v === '0') return fb;
    return JSON.parse(v);
  } catch(e) {
    localStorage.removeItem(k);
    return fb;
  }
};

        <div id="micPulseIcon" style="width:56px; height:56px; background:rgba(96,165,250,0.15); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-size:24px;">🎙️</div>
        <div id="recordingTimer" style="color:#FFD700; font-size:28px; font-weight:900; font-family:monospace; margin-bottom:6px;">00:00</div>
        <div id="recordingStatus" style="color:#888; font-size:12px; margin-bottom:14px;">Ready to record</div>

        <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
          <button id="startRecBtn" style="background:#EF4444; color:white; font-weight:bold; padding:10px 18px; border-radius:12px; border:none; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:6px;">
            <span>🔴</span> Start Recording
          </button>
          <button id="stopRecBtn" disabled style="background:#4B5563; color:white; font-weight:bold; padding:10px 18px; border-radius:12px; border:none; cursor:not-allowed; font-size:13px; display:flex; align-items:center; gap:6px;">
            <span>⏹️</span> Stop
          </button>
        </div>
      </div>

      <div id="audioPreviewContainer" style="display:none; margin-bottom:14px; background:#222; padding:12px; border-radius:12px;">
        <p style="color:#60A5FA; font-size:11px; font-weight:bold; margin-bottom:6px;">Voice Note Preview:</p>
        <audio id="audioPlayback" controls style="width:100%; height:36px;"></audio>
        <button id="sendVoiceNoteBtn" style="background:#10B981; color:black; font-weight:bold; width:100%; padding:10px; border-radius:10px; border:none; cursor:pointer; margin-top:10px; font-size:13px;">
          🚀 Send Voice Note to Sirwise AI Tutor
        </button>
      </div>

      <button id="cancelRecordBtn" style="background:#333; color:white; padding:10px; border-radius:10px; border:none; width:100%; font-weight:bold; cursor:pointer; font-size:13px;">Cancel</button>
    </div>
  `;

  document.body.appendChild(modal);

  let mediaRecorder = null;
  let audioChunks = [];
  let timerInterval = null;
  let secondsElapsed = 0;
  let audioBlob = null;

  const startBtn = document.getElementById('startRecBtn');
  const stopBtn = document.getElementById('stopRecBtn');
  const timerElem = document.getElementById('recordingTimer');
  const statusElem = document.getElementById('recordingStatus');
  const micIcon = document.getElementById('micPulseIcon');
  const audioPreview = document.getElementById('audioPreviewContainer');
  const audioPlayback = document.getElementById('audioPlayback');

  function cleanupRecorder() {
    if (timerInterval) clearInterval(timerInterval);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    modal.remove();
  }

  document.getElementById('closeRecordModalBtn').onclick = cleanupRecorder;
  document.getElementById('cancelRecordBtn').onclick = cleanupRecorder;

  startBtn.onclick = async function() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('Audio recording is not supported in this browser.', 'error');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(audioBlob);
        audioPlayback.src = audioUrl;
        audioPreview.style.display = 'block';
        statusElem.textContent = '✅ Recording complete! Listen preview or send.';
        statusElem.style.color = '#10B981';
        if (micIcon) micIcon.style.boxShadow = 'none';
      };

      mediaRecorder.start();
      secondsElapsed = 0;
      timerElem.textContent = '00:00';
      statusElem.textContent = '🔴 Recording live voice note...';
      statusElem.style.color = '#EF4444';
      if (micIcon) micIcon.style.boxShadow = '0 0 20px #EF4444';

      startBtn.disabled = true;
      startBtn.style.background = '#4B5563';
      startBtn.style.cursor = 'not-allowed';

      stopBtn.disabled = false;
      stopBtn.style.background = '#EF4444';
      stopBtn.style.cursor = 'pointer';

      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerElem.textContent = `${mins}:${secs}`;
      }, 1000);

    } catch (err) {
      console.error('Microphone error:', err);
      showToast('Microphone access blocked. Please allow permissions.', 'error');
    }
  };

  stopBtn.onclick = function() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      if (timerInterval) clearInterval(timerInterval);
      
      startBtn.disabled = false;
      startBtn.style.background = '#EF4444';
      startBtn.style.cursor = 'pointer';

      stopBtn.disabled = true;
      stopBtn.style.background = '#4B5563';
      stopBtn.style.cursor = 'not-allowed';
    }
  };

  document.getElementById('sendVoiceNoteBtn').onclick = function() {
    showToast('🚀 Voice note sent! Sirwise AI Tutor is reviewing audio', 'success');
    cleanupRecorder();
  };

  modal.onclick = (e) => { if (e.target === modal) cleanupRecorder(); };
};

(function(){

    ['loader','splash','loading','preloader','appLoader','initialLoader','splashScreen'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){ el.style.display='none'; el.style.opacity='0'; el.remove(); }

      }

    document.body.style.overflow='auto';
    document.body.style.opacity='1';
    const main=document.getElementById('programs')||document.getElementById('root')||document.querySelector('main')||document.getElementById('app');
    if(main){ main.style.display='block'; main.style.opacity='1'; }

  }
  // Try immediately and after delays
  forceShow();
  setTimeout(forceShow, 500);
  setTimeout(forceShow, 1500);
  setTimeout(forceShow, 3000);
  window.addEventListener('load', forceShow);
})();
