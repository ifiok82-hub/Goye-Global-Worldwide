<script>
  window.payWithFlutterwave = function(productName, usdPrice){
    const customerEmail = prompt("Enter your email for instant delivery (e.g. parent@gmail.com):");
    if(!customerEmail || customerEmail.length < 5 || !customerEmail.includes("@") || !customerEmail.includes(".") || customerEmail === "null" || customerEmail.includes("null")){
      alert("Please enter a complete valid email address (e.g. parent@gmail.com)");
      return;
    }

    if (typeof FlutterwaveCheckout !== 'function') {
      alert("Flutterwave SDK is loading... Please wait a moment and click again.");
      return;
    }

    const validName = customerEmail.split('@')[0] || "GOYE Customer";

    FlutterwaveCheckout({
      public_key: "FLWPUBK-cbb518a9b8f74421e887f4a1ec911ea7-X",
      tx_ref: "SIRWISE_FW_"+Date.now(),
      amount: 74985,
      currency: "NGN",
      payment_options: "card,banktransfer,ussd",
      customer: {
        email: customerEmail,
        name: validName,
        phone_number: ''
      },
      customizations: {
        title: "Sirwise AI Web3 Academy",
        description: "Global $49.99 RC BN3583773",
        logo: "https://www.gasv.store/logo.png",
      },
      callback: function(data){
        console.log(data);
        if(data && (data.status === "successful" || data.status === "completed" || data.transaction_id || data.tx_ref)){
          const txId = data.transaction_id || data.tx_ref || ("GOYE-TX-" + Date.now());
          const txRef = data.tx_ref || ("GOYE-FLW-" + Date.now());
          alert("✅ Real payment verified ₦74,985 Success Ref: " + txRef);
          localStorage.setItem("goye_order_"+txRef, JSON.stringify({email:customerEmail, product:productName, price:usdPrice, tx:txId, ref:txRef, status:"completed", date: new Date().toISOString()}));
          localStorage.setItem("sirwise_paid", "true");
          localStorage.setItem("academy_unlocked", "true");
          try {
            const stored = JSON.parse(localStorage.getItem('goye_unlocked_products') || '[]');
            if (!stored.includes(productName)) {
              stored.push(productName);
              localStorage.setItem('goye_unlocked_products', JSON.stringify(stored));
            }
          } catch(e) {}
          window.location.hash = "#academy";
        } else {
          alert("Payment not successful - Real money required - Amount must be ₦74,985");
        }
      },
      onclose: function(){
        console.log("Flutterwave closed");
      }
    });
  };
</script>

<script>
// GOYE Global - Pi GCV Machine & Payment Engine
// GCV Rate: 1 Pi = $314,159 GCV
window.GCV_RATE = 314159;

window.PI_CONVERTER = {
  usdToPi: (usd)=> (usd / window.GCV_RATE).toFixed(6).replace(/\.?0+$/, '') || '0.000001',
  piToUsd: (pi)=> (pi * window.GCV_RATE).toFixed(2),
  formatPrice: function(usd){
    const pi = this.usdToPi(usd);
    const ngn = (usd * 1500).toFixed(0);
    const gbp = (usd * 0.79).toFixed(2);
    const isPiBrowser = navigator.userAgent.includes('PiBrowser') || typeof Pi !== 'undefined';
    if(isPiBrowser){
      return `<span style="color:#FFD700; font-weight:bold;">${pi} Pi</span> <span style="color:#888; font-size:11px;">GCV ($${usd} / ₦${Number(ngn).toLocaleString()} / £${gbp})</span>`;
    }else{
      return `<span style="color:#00FF88; font-weight:bold;">$${usd}</span> <span style="color:#FFD700; font-size:12px; background:#7D2AE7; padding:2px 6px; border-radius:6px; margin-left:6px;">${pi} Pi GCV</span> <span style="color:#888; font-size:10px;">₦${Number(ngn).toLocaleString()} £${gbp}</span>`;
    }
  },
  formatButton: function(usd){
    const pi = this.usdToPi(usd);
    const isPiBrowser = navigator.userAgent.includes('PiBrowser') || typeof Pi !== 'undefined';
    if(isPiBrowser){
      return `Start Learning (${pi} Pi)`;
    }else{
      return `Start Learning ($${usd} • ${pi} Pi)`;
    }
  }
};

window.convertAllPrices = function(){
  document.querySelectorAll('[data-usd-price]').forEach(el=>{
    const usd = parseFloat(el.getAttribute('data-usd-price'));
    if(!isNaN(usd)){
      el.innerHTML = PI_CONVERTER.formatPrice(usd);
    }
  });
  document.querySelectorAll('[data-usd-button]').forEach(btn=>{
    const usd = parseFloat(btn.getAttribute('data-usd-button'));
    if(!isNaN(usd)){
      btn.textContent = PI_CONVERTER.formatButton(usd);
    }
  });
};

window.addEventListener('load', ()=> setTimeout(convertAllPrices, 800));
document.addEventListener('DOMContentLoaded', ()=> setTimeout(convertAllPrices, 1000));

let piReady=false;
window.initPiSDK=function(){
  try{
    if(typeof Pi!=='undefined'){
      try{ Pi.init({version:"2.0", sandbox:false}); piReady=true; console.log('Pi SDK Mainnet ready'); }catch(e){ try{ Pi.init({version:"2.0", sandbox:true}); piReady=true; }catch(e2){} }
    }
  }catch(e){}
};
setTimeout(initPiSDK,300); setTimeout(initPiSDK,1200); window.addEventListener('load',initPiSDK);

window.isPiBrowser=function(){ return navigator.userAgent.includes('PiBrowser') || (typeof Pi!=='undefined' && typeof Pi.nativeFeaturesList!=='undefined'); };
window.isRealPiBrowser = window.isPiBrowser;

window.loginWithPi=async function(){
  const btn=document.getElementById('loginWithPiBtn');
  if(btn){ btn.innerHTML='⏳ Connecting...'; btn.disabled=false; btn.style.pointerEvents='auto'; }
  const inPiBrowser=isPiBrowser();
  if(!inPiBrowser && typeof Pi==='undefined'){ if(btn){ btn.innerHTML='🟣 Login with Pi'; } if(typeof showPiGuideReal==='function') showPiGuideReal(); return; }
  if(!piReady){ initPiSDK(); await new Promise(r=>setTimeout(r,1200)); }
  if(typeof Pi==='undefined'){ if(btn){ btn.innerHTML='🟣 Login with Pi'; } alert('Pi SDK loading... Wait 3 sec and tap again in Pi Browser'); return; }
  try{
    const auth=await Pi.authenticate(['username','payments'], function(p){
      console.log('Incomplete payment',p);
      if(p&&p.identifier){ fetch('/api/pi-complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier, txid:p.txid||'incomplete'})}).catch(()=>{}); }
    });
    const username=auth.user.username;
    localStorage.setItem('pi_username',username);
    localStorage.setItem('user_email',username.toLowerCase()+'@pi.network');
    localStorage.setItem('pi_access_token',auth.accessToken);
    localStorage.setItem('is_pi_user','true');
    try{
      let c=JSON.parse(localStorage.getItem('registered_customers')||'[]');
      const email=username.toLowerCase()+'@pi.network';
      if(!c.some(x=>x.email===email)){
        c.unshift({name:username,email:email,pupil_name:username,parent:'Pi Network',date:new Date().toLocaleDateString('en-GB'),date_wat:new Date().toLocaleString('en-GB',{timeZone:'Africa/Lagos'})+' WAT Lagos',country:'Pi Network GCV $314,159'});
        localStorage.setItem('registered_customers',JSON.stringify(c.slice(0,500)));
        let lc=parseInt(localStorage.getItem('lead_submissions')||'0')||0;
        localStorage.setItem('lead_submissions',(lc+1).toString());
      }
    }catch(e){}
    if(btn){ btn.innerHTML='✅ '+username; btn.style.background='#00AA00'; }
    const t=document.createElement('div');
    t.style.cssText='position:fixed; top:80px; left:50%; transform:translateX(-50%); background:#00AA00; color:white; padding:18px 28px; border-radius:14px; z-index:9999999; font-weight:bold;';
    t.innerHTML='✅ Welcome '+username+'!';
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),1800);
  }catch(e){
    console.error(e);
    if(btn){ btn.innerHTML='🟣 Login with Pi'; btn.style.background='#7D2AE7'; }
    const m=(e.message||'').toLowerCase();
    if(m.includes('cancel')||m.includes('denied')||m.includes('dismiss')) return;
    if(m.includes('incomplete')||m.includes('pending')){ alert('Incomplete Pi payment blocking. Go to minepi.com -> My Payments -> Cancel incomplete, then try again'); return; }
    if(inPiBrowser){ alert('Tap Login with Pi again - Approve PURPLE popup at TOP - If no popup, close tab and reopen gasv.store'); }
    else{ if(typeof showPiGuideReal==='function') showPiGuideReal(); }
  }
};

window.createPiPayment=async function(usdAmount){
  usdAmount = usdAmount || 49.99;
  const piAmount = (usdAmount / window.GCV_RATE).toFixed(6);
  if(typeof Pi==='undefined'){ alert('Pay with Pi only in Pi Browser. In Chrome use Paystack Card. Amount: $'+usdAmount+' = '+piAmount+' Pi GCV'); return; }
  try{
    const paymentData={amount: parseFloat(piAmount), memo:"GOYE Global Sirwise AI WEB3 Academy - RC BN3583773 - gasv.store - $"+usdAmount, metadata:{usd:usdAmount, pi:piAmount, gcv:window.GCV_RATE, store:"gasv.store", rc:"BN3583773"}};
    const callbacks={
      onReadyForServerApproval: async function(id){ try{ const r=await fetch('/api/pi-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}); console.log('Pi approved',await r.json()); }catch(e){ console.error(e); } },
      onReadyForServerCompletion: async function(id,txid){ try{ const r=await fetch('/api/pi-complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid})}); const d=await r.json(); console.log('Pi completed',d); if(d.completed){ alert('✅ Pi Payment Verified! '+piAmount+' Pi = $'+usdAmount+' - TxID:'+txid); window.location.hash='#academy'; } }catch(e){ console.error(e); } },
      onCancel:function(id){ console.log('Pi cancelled',id); },
      onError:function(err){ console.error(err); alert('Pi error: '+(err.message||err)); }
    };
    await Pi.createPayment(paymentData, callbacks);
  }catch(e){ console.error(e); alert('Pi payment error: '+(e.message||e)); }
};

window.showPiGuideReal = function(){
  if(document.getElementById('piGuideModal')) return;
  const m=document.createElement('div'); m.id='piGuideModal';
  m.style.cssText='position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:9999999; display:flex; align-items:center; justify-content:center; padding:20px;';
  m.innerHTML='<div style="background:#111; border:3px solid #7D2AE7; border-radius:20px; padding:20px; max-width:380px; width:100%; text-align:center;"><h2 style="color:#7D2AE7; font-size:20px; margin:0 0 12px;">🟣 Pi Browser Required</h2><p style="color:white; font-size:14px;">You are in Chrome/Normal browser. Login with Pi works only inside Pi Browser App.</p><div style="background:#222; padding:12px; border-radius:12px; margin:12px 0; text-align:left; border:1px solid #333;"><p style="color:#FFD700; font-size:13px; margin:6px 0;">1️⃣ Download Pi Browser from minepi.com</p><p style="color:#FFD700; font-size:13px; margin:6px 0;">2️⃣ Open Pi Browser → Type: gasv.store</p><p style="color:#FFD700; font-size:13px; margin:6px 0;">3️⃣ Tap Login with Pi → Approve</p></div><div style="display:grid; gap:10px; margin-top:14px;"><a href="https://minepi.com/pi-browser" target="_blank" style="background:#7D2AE7; color:white; padding:14px; border-radius:12px; text-decoration:none; font-weight:bold; display:block;">📥 Download Pi Browser</a><button onclick="document.getElementById(\'piGuideModal\').remove()" style="background:#333; color:white; padding:12px; border-radius:12px; border:1px solid #555; width:100%; font-weight:bold;">Continue with Email</button></div></div>';
  m.onclick=(e)=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m);
};
window.showPiGuide = window.showPiGuideReal;

document.addEventListener('DOMContentLoaded',()=>{ setTimeout(()=>{ const b=document.getElementById('loginWithPiBtn'); if(b){ b.style.pointerEvents='auto'; b.style.cursor='pointer'; b.disabled=false; b.onclick=window.loginWithPi; if(b.innerHTML.includes('Connecting')) b.innerHTML='🟣 Login with Pi'; } convertAllPrices(); },1500); });

// Safe parse - Fix NaN crash
window.safeParse = function(k,fb){ try{ const v=localStorage.getItem(k); if(!v||v==='NaN'||v==='undefined'||v==='null'||v==='') return fb; if(fb instanceof Array && v==='0') return fb; return JSON.parse(v); }catch(e){ localStorage.removeItem(k); return fb; } };

window.openAdminRecovery = function(){
  localStorage.setItem('is_admin','true');
  localStorage.setItem('admin_unlocked','true');
  location.hash='#admin-dashboard';
  location.reload();
};
</script>
