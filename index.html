// Fix Pi Browser detection - Real check for Pi Browser
window.isRealPiBrowser = function(){
  const ua = navigator.userAgent || '';
  const hasPiBrowserUA = ua.includes('PiBrowser') || ua.includes('Pi Browser');
  const hasPiSDK = typeof Pi !== 'undefined' && Pi !== null;
  const isPiHost = window.location.protocol === 'https:' && (window.location.hostname.includes('pi.') || window.location.hostname === 'gasv.store');
  // In Pi Browser, window.Pi exists after sdk loads - Also check for Pi native
  const hasPiNative = hasPiSDK && (typeof Pi.nativeFeaturesList !== 'undefined' || typeof Pi.authenticate === 'function');
  console.log('Pi Browser Check:', {ua, hasPiBrowserUA, hasPiSDK, hasPiNative});
  return hasPiBrowserUA || hasPiNative;
};

window.loginWithPi = async function(){

// Safe parse - Fixes NaN crash - Keep from previous fix
window.safeParse = window.safeParse || function(key, fallback){
  try{
    const val = localStorage.getItem(key);
    if(!val || val==='NaN' || val==='undefined' || val==='null' || val==='') return fallback;

    return JSON.parse(val);

};
