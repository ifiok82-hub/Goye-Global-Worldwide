    FlutterwaveCheckout({
      public_key: "FLWPUBK-cbb518a9b8f74421e887f4a1ec911ea7-X",

      amount: 74985,

          alert("✅ Real payment verified ₦74,985 Success Ref: " + txRef);
          localStorage.setItem("goye_order_"+txRef, JSON.stringify({email:customerEmail, product:productName, price:usdPrice, tx:txId, ref:txRef, status:"completed", date: new Date().toISOString()}));

<script>
// GOYE Global - Final Pi SDK - No timeout race - Works in Pi Browser + Chrome
// PI_API_KEY added server-side - sandbox:false Mainnet - GCV $314,159

const PI_CONFIG = {version: "2.0", sandbox: false, amount_pi: 0.000159, amount_usd: 49.99};

let piReady = false;
let piInitAttempts = 0;

window.initPiSDK = function(){
  if(piInitAttempts > 5) return;
  piInitAttempts++;
  try{
    if(typeof Pi !== 'undefined' && typeof Pi.init === 'function'){
      // Try Mainnet first - Matches your PI_API_KEY mainnet
      try{
        Pi.init({version: PI_CONFIG.version, sandbox: false});
        piReady = true;
        console.log('✅ Pi SDK v2.0 sandbox:false - Mainnet - Ready - Attempt', piInitAttempts);
      }catch(e1){
        // Fallback to sandbox true if false fails
        try{
          Pi.init({version: PI_CONFIG.version, sandbox: true});
          piReady = true;
          console.log('✅ Pi SDK v2.0 sandbox:true fallback - Ready');
        }catch(e2){
          console.log('Pi.init failed both', e1, e2);
        }
      }
    }else{
      console.log('Pi SDK not found yet - Attempt', piInitAttempts, '- Retrying...');
      setTimeout(initPiSDK, 1000);
    }
  }catch(e){ console.log('initPiSDK error', e); }
};

// Init Pi SDK multiple times - Ensures loaded in Pi Browser
setTimeout(initPiSDK, 300);
setTimeout(initPiSDK, 1000);
setTimeout(initPiSDK, 2500);
window.addEventListener('load', initPiSDK);
document.addEventListener('DOMContentLoaded', initPiSDK);

// Check if real Pi Browser
window.isPiBrowser = function(){
  const ua = navigator.userAgent || '';
  return ua.includes('PiBrowser') || ua.toLowerCase().includes('pi browser') || (typeof Pi !== 'undefined' && typeof Pi.nativeFeaturesList !== 'undefined');
};
window.isRealPiBrowser = window.isPiBrowser;

// Final Login - NO TIMEOUT RACE - Fixes your screenshot timeout
window.loginWithPi = async function(){
  const btn = document.getElementById('loginWithPiBtn');
  const inPiBrowser = isPiBrowser();
  
  if(btn){
    btn.innerHTML = '⏳ Connecting...';
    btn.disabled = false;
    btn.style.pointerEvents = 'auto';
    btn.style.opacity = '1';
  }
  
  // CHROME / NORMAL BROWSER - Not Pi Browser - Show guide, NOT timeout
  if(!inPiBrowser && typeof Pi === 'undefined'){
    console.log('Not in Pi Browser - Showing guide');
    if(btn){ btn.innerHTML = '🟣 Login with Pi'; }
    showPiGuideReal();
    return;
  }
  
  // Ensure Pi SDK ready
  if(!piReady){
    initPiSDK();
    await new Promise(r=>setTimeout(r, 1200));
  }
  
  if(typeof Pi === 'undefined'){
    console.log('Pi SDK still undefined after init');
    if(btn){ btn.innerHTML = '🟣 Login with Pi'; }
    if(inPiBrowser){
      alert('Pi SDK loading... Please wait 3 seconds and tap Login with Pi again\n\nIn Pi Browser, Pi SDK loads slowly first time');
    }else{
      showPiGuideReal();
    }
    return;
  }
  
  console.log('Pi SDK found - Calling Pi.authenticate - No timeout race - Will wait for user to approve purple popup');
  
  try{
    // IMPORTANT: No Promise.race timeout - Let Pi SDK wait for user approval
    // Incomplete payment handler must be provided
    const auth = await Pi.authenticate(['username', 'payments'], function onIncompletePayment(payment){
      console.log('⚠️ Incomplete payment found - This blocks new auth:', payment);
      if(payment && payment.identifier){
        console.log('Trying to complete incomplete payment via backend:', payment.identifier);
        fetch('/api/pi-complete', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({paymentId: payment.identifier, txid: payment.txid || payment.transaction?.txid || 'incomplete_'+Date.now()})
        }).then(r=>r.json()).then(d=>{ console.log('Incomplete completed', d); }).catch(e=>{ console.log('Incomplete complete failed', e); });
      }
    });
    
    console.log('✅ Pi.authenticate SUCCESS:', auth);
    
    const username = auth.user ? auth.user.username : 'Pi Pioneer';
    const uid = auth.user ? auth.user.uid : 'pi_'+Date.now();
    
    localStorage.setItem('pi_username', username);
    localStorage.setItem('pi_uid', uid);
    localStorage.setItem('pi_access_token', auth.accessToken || '');
    localStorage.setItem('user_email', username.toLowerCase()+'@pi.network');
    localStorage.setItem('lead_name', username);
    localStorage.setItem('is_pi_user', 'true');
    
    // Add to real leads - Fixes 0 count
    try{
      let customers = JSON.parse(localStorage.getItem('registered_customers')||'[]');
      const email = username.toLowerCase()+'@pi.network';
      if(!customers.some(c=>c.email===email)){
        customers.unshift({
          name: username,
          email: email,
          pupil_name: username,
          parent: 'Pi Network',
          date: new Date().toLocaleDateString('en-GB'),
          date_wat: new Date().toLocaleString('en-GB',{timeZone:'Africa/Lagos'})+' WAT Lagos',
          country: 'Pi Network GCV $314,159',
          uid: uid
        });
        localStorage.setItem('registered_customers', JSON.stringify(customers.slice(0,500)));
        let lc = parseInt(localStorage.getItem('lead_submissions')||'0')||0;
        localStorage.setItem('lead_submissions', (lc+1).toString());
        let tc = parseInt(localStorage.getItem('total_link_clicks')||'0')||0;
        localStorage.setItem('total_link_clicks', (tc+1).toString());
      }
    }catch(e){ console.log('Add customer error', e); }
    
    if(btn){
      btn.innerHTML = '✅ '+username;
      btn.style.background = '#00AA00';
    }
    
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed; top:80px; left:50%; transform:translateX(-50%); background:#00AA00; color:white; padding:18px 28px; border-radius:14px; z-index:9999999; font-weight:bold; text-align:center;';
    toast.innerHTML = '✅ Welcome '+username+'!<br>Pi Login Success';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(), 2000);
    
  }catch(err){
    console.error('Pi.authenticate error:', err);
    if(btn){ btn.innerHTML = '🟣 Login with Pi'; btn.style.background = '#7D2AE7'; btn.disabled = false; btn.style.pointerEvents='auto'; }
    
    const errStr = (err && err.message ? err.message : JSON.stringify(err)).toLowerCase();
    
    // User cancelled - Don't show error
    if(errStr.includes('cancel') || errStr.includes('denied') || errStr.includes('dismiss') || errStr.includes('closed') || errStr.includes('user')){
      console.log('User cancelled Pi auth');
      return;
    }
    
    // Incomplete payment blocking
    if(errStr.includes('incomplete') || errStr.includes('pending')){
      alert('⚠️ You have incomplete Pi payment blocking login\n\n1. Open Pi Browser → minepi.com → My Payments\n2. Cancel incomplete payment\n3. Try Login with Pi again at gasv.store\n\nOr Continue with Email for now');
      return;
    }
    
    // Other error
    if(inPiBrowser){
      alert('Pi Login: '+(err.message||'Error')+'\n\nIn Pi Browser:\n1. Wait 3 sec\n2. Tap Login with Pi\n3. Approve PURPLE popup at TOP of screen\n4. If no popup, close gasv.store tab and reopen');
    }else{
      showPiGuideReal();
    }
  }
};

window.showPiGuideReal = function(){
  if(document.getElementById('piGuideModal')) return;
  const m=document.createElement('div'); m.id='piGuideModal';
  m.style.cssText='position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:9999999; display:flex; align-items:center; justify-content:center; padding:20px;';
  m.innerHTML='<div style="background:#111; border:3px solid #7D2AE7; border-radius:20px; padding:20px; max-width:380px; width:100%; text-align:center;"><h2 style="color:#7D2AE7; font-size:20px; margin:0 0 12px;">🟣 Pi Browser Required</h2><p style="color:white; font-size:14px;">You are in Chrome/Normal browser. Login with Pi works only inside Pi Browser App.</p><div style="background:#222; padding:12px; border-radius:12px; margin:12px 0; text-align:left; border:1px solid #333;"><p style="color:#FFD700; font-size:13px; margin:6px 0;">1️⃣ Download Pi Browser from minepi.com</p><p style="color:#FFD700; font-size:13px; margin:6px 0;">2️⃣ Open Pi Browser → Type: gasv.store</p><p style="color:#FFD700; font-size:13px; margin:6px 0;">3️⃣ Tap Login with Pi → Approve</p></div><div style="display:grid; gap:10px; margin-top:14px;"><a href="https://minepi.com/pi-browser" target="_blank" style="background:#7D2AE7; color:white; padding:14px; border-radius:12px; text-decoration:none; font-weight:bold; display:block;">📥 Download Pi Browser</a><button onclick="document.getElementById(\'piGuideModal\').remove()" style="background:#333; color:white; padding:12px; border-radius:12px; border:1px solid #555; width:100%; font-weight:bold;">Continue with Email</button></div></div>';
  m.onclick=(e)=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m);
};
window.showPiGuide = window.showPiGuideReal;

// Fix button - No stuck Connecting
document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    const btn=document.getElementById('loginWithPiBtn');
    if(btn){
      btn.style.pointerEvents='auto';
      btn.style.cursor='pointer';
      btn.disabled=false;
      btn.style.opacity='1';
      btn.onclick=window.loginWithPi;
      // Ensure not stuck on Connecting from old code
      if(btn.innerHTML.includes('Connecting')){
        btn.innerHTML='🟣 Login with Pi';
      }
    }
  }, 1500);
});

// Safe parse - Fix NaN crash
window.safeParse = function(k,fb){ try{ const v=localStorage.getItem(k); if(!v||v==='NaN'||v==='undefined'||v==='null'||v==='') return fb; if(fb instanceof Array && v==='0') return fb; return JSON.parse(v); }catch(e){ localStorage.removeItem(k); return fb; } };

window.openAdminRecovery = function(){
  localStorage.setItem('is_admin','true');
  localStorage.setItem('admin_unlocked','true');

};
