    <script>
      const methods = ['log', 'warn', 'error'];
      methods.forEach(method => {
        const orig = console[method];
        console[method] = function(...args) {
          const str = args.map(a => String(a?.message || a)).join(' ');
          if (str.includes('[vite]')) return;
          orig.apply(console, args);
        };
      });
      window.addEventListener('error', e => {
        if (e.message && e.message.includes('[vite]')) e.preventDefault();
      });
    </script>

    <script>
      const originalError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
        originalError.apply(console, args);
      };
    </script>

        const validName = customerEmail.split('@')[0] || "GOYE Customer";

        FlutterwaveCheckout({

          tx_ref: "SIRWISE_FW_"+Date.now(),
          amount: 74985,
          currency: "NGN",
          payment_options: "card,banktransfer,ussd",

              const txRef = data.tx_ref || ("GOYE-FLW-" + Date.now());
              alert("✅ Real payment verified ₦74,985 Success Ref: " + txRef);
              localStorage.setItem("goye_order_"+txRef, JSON.stringify({email:customerEmail, product:productName, price:usdPrice, tx:txId, ref:txRef, status:"completed", date: new Date().toISOString()}));
              localStorage.setItem("sirwise_paid", "true");
              localStorage.setItem("academy_unlocked", "true");
              try {

    <script>
      function initPiSDK() {
        if (typeof Pi !== 'undefined') {
          try {
            Pi.init({ version: "2.0", sandbox: true });
            console.log('✅ Pi SDK Initialized - Testnet sandbox:true - gasv.store');
            const btn = document.getElementById('loginWithPiBtn');
            if (btn) {
              btn.style.opacity = '1';
              btn.style.pointerEvents = 'auto';
              btn.style.cursor = 'pointer';
            }
          } catch(e) {
            console.warn('Pi init notice:', e);
          }
        } else {
          console.log('Pi SDK not loaded - Not in Pi Browser - Normal browser mode');
        }
      }

      setTimeout(initPiSDK, 1000);
      window.addEventListener('load', function() {
        setTimeout(initPiSDK, 1500);
      });

      function onIncompletePaymentFound(payment) {
        console.log('Incomplete payment found:', payment);
        if (typeof Pi !== 'undefined' && Pi.completePayment) {
          return Pi.completePayment(payment.identifier);
        }
      }

      // MAIN LOGIN FUNCTION - For Pi Ecosystem Listing & Pioneers
      async function loginWithPi() {
        console.log('Login with Pi clicked - gasv.store');

        // Check if Pi SDK exists
        if (typeof Pi === 'undefined') {
          // Not in Pi Browser - Show step-by-step Pi Browser guide modal

          if (existing) existing.remove();

          const guideModal = document.createElement('div');
          guideModal.id = 'piGuideModal';
          guideModal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999999; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;';
          guideModal.innerHTML = `
            <div style="background:#111; border:3px solid #7D2AE7; border-radius:20px; padding:22px; max-width:420px; width:100%; text-align:center; box-shadow:0 0 40px rgba(125,42,231,0.5);">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="color:#7D2AE7; font-weight:bold; font-size:18px;">🟣 Pi Browser Required</span>
                <button onclick="document.getElementById('piGuideModal').remove()" style="background:#222; color:#fff; border:1px solid #444; border-radius:50%; width:30px; height:30px; font-weight:bold; cursor:pointer;">X</button>
              </div>
              <p style="color:white; font-size:13.5px; margin:0 0 14px 0; line-height:1.4;">
                <strong>Login with Pi</strong> requires the official <strong>Pi Browser App</strong> with active Pi Network Wallet authentication.
              </p>
              <div style="background:#1a1a1a; border:1px solid #333; padding:14px; border-radius:14px; margin:12px 0; text-align:left;">
                <p style="color:#FFD700; font-size:12.5px; margin:4px 0; font-weight:bold;">1️⃣ Open Pi Browser App on your phone</p>
                <p style="color:#FFD700; font-size:12.5px; margin:4px 0; font-weight:bold;">2️⃣ Enter website URL: <span style="color:#00FF88;">https://www.gasv.store</span></p>
                <p style="color:#FFD700; font-size:12.5px; margin:4px 0; font-weight:bold;">3️⃣ Tap top-right 🟣 Login with Pi button</p>
                <p style="color:#00FF88; font-size:12px; margin:8px 0 0 0; font-weight:bold;">✅ Instant 1-click Pioneer login & $314,159 GCV Pi Payment!</p>
              </div>
              <div style="display:grid; gap:10px; margin-top:16px;">
                <a href="https://minepi.com/pi-browser" target="_blank" style="height:50px; background:#7D2AE7; color:white; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:bold; text-decoration:none; font-size:14px; border:2px solid #9d52f8;">
                  📥 Download Pi Browser App
                </a>
                <button onclick="document.getElementById('piGuideModal').remove()" style="height:45px; background:#222; color:#ccc; border:1px solid #444; border-radius:12px; cursor:pointer; font-weight:bold; font-size:13px;">
                  Continue in Standard Browser (Email Login)
                </button>
              </div>
              <p style="color:#888; font-size:10px; margin-top:12px;">Official goyedagosmess@gmail.com | RC BN3583773 | www.gasv.store</p>
            </div>
          `;
          guideModal.onclick = function(e) { if (e.target === guideModal) guideModal.remove(); };
          document.body.appendChild(guideModal);
          return;
        }

        // Inside Pi Browser App - Execute Real Pi SDK Authenticate
        try {
          const btn = document.getElementById('loginWithPiBtn');
          if (btn) { btn.innerHTML = '⏳ Connecting Pi...'; btn.disabled = true; }

          const scopes = ['username', 'payments'];
          const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
          
          const username = auth.user ? auth.user.username : ('pioneer_' + Date.now().toString().slice(-4));
          const piUid = auth.user ? auth.user.uid : ('uid_' + Date.now());
          const email = username.includes('@') ? username : (username + '@pi.network');
          
          localStorage.setItem('user_email', email);
          localStorage.setItem('customer_email', email);
          localStorage.setItem('pi_username', username);
          localStorage.setItem('pi_uid', piUid);
          localStorage.setItem('pi_access_token', auth.accessToken || 'pi_token_active');
          localStorage.setItem('is_pi_user', 'true');
          localStorage.setItem('lead_name', username);

          // Save to registered customers array
          let users = JSON.parse(localStorage.getItem('registered_customers') || '[]');
          if (!users.some(u => u.email === email)) {
            users.unshift({
              name: username,
              email: email,
              pupil_name: username,
              parent: 'Pi Network Pioneer',
              date: new Date().toLocaleDateString('en-GB'),
              date_wat: new Date().toLocaleString('en-GB', { timeZone: 'Africa/Lagos' }) + ' WAT Lagos',
              country: 'Pi Network - GCV $314,159'
            });
            localStorage.setItem('registered_customers', JSON.stringify(users.slice(0, 200)));

          if (btn) {
            btn.innerHTML = '✅ @' + username;
            btn.style.background = '#00AA00';
            btn.disabled = false;
          }

          if (window.dispatchEvent) {
            window.dispatchEvent(new CustomEvent('piAuthSuccess', { detail: { username, email } }));
          }

          // Show floating success toast
          const successModal = document.createElement('div');
          successModal.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#00AA00; color:white; padding:16px 24px; border-radius:14px; z-index:9999999; font-weight:bold; box-shadow:0 4px 25px rgba(0,0,0,0.6); text-align:center; font-size:14px;';
          successModal.innerHTML = `✅ Welcome @${username}! Pi Login Success — Opening Sirwise Academy`;
          document.body.appendChild(successModal);
          setTimeout(() => successModal.remove(), 3500);

          setTimeout(() => {
            window.location.hash = 'academy';
            const academyTabs = document.querySelectorAll('button, a');
            academyTabs.forEach(b => {
              if (b.textContent && b.textContent.toUpperCase().includes('ACADEMY')) {
                (b as HTMLElement).click();
              }
            });
          }, 800);

          return auth;
        } catch (e) {
          console.error('Pi Auth Failed', e);
          const btn = document.getElementById('loginWithPiBtn');
          if (btn) { btn.innerHTML = '🟣 Login with Pi'; btn.disabled = false; btn.style.background = '#7D2AE7'; }
          if (e && e.message && e.message.includes('cancelled')) {
            alert('Pi Login notice: Authorization cancelled by user.');
          } else {
            alert('Pi Login Notice: Please open https://www.gasv.store in Pi Browser app (Testnet Sandbox Mode) to authenticate with Pi wallet.');
          }
        }
      }

      // Pi Payment Function - GCV $314,159 - Academy $49.99 = 0.000159 Pi
      async function payWithPi(overrideEmail) {
        let email = overrideEmail || localStorage.getItem('user_email') || localStorage.getItem('customer_email');
        if (!email || !email.includes('@')) {
          const promptEmail = prompt('Enter your email address to register your Pi Academy license:', 'pioneer@pi.network');
          if (promptEmail && promptEmail.includes('@')) {
            email = promptEmail.trim();
            localStorage.setItem('user_email', email);
            localStorage.setItem('customer_email', email);
          } else {
            alert('A valid email address is required to generate your Blockchain Certificate!');
            return;
          }
        }

        if (typeof Pi === 'undefined') {
          loginWithPi();
          return;
        }

        try {
          const paymentData = {
            amount: 0.000159, // $49.99 USD / $314,159 GCV rate
            memo: "Sirwise AI Web3 Academy - 8 Modules - Global Certificate - RC BN3583773 - " + email,
            metadata: { email: email, product: "Sirwise Academy", academy: "8 Modules", official: "goyedagosmess@gmail.com" }
          };

          const payment = await Pi.createPayment(paymentData, {
            onReadyForServerApproval: function(paymentId) {
              console.log('Ready for Server Approval', paymentId);
              fetch('/api/pi/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentId, email })
              }).catch(err => console.warn('Pi approval request notice', err));
            },
            onReadyForServerCompletion: function(paymentId, txid) {
              console.log('Ready for Server Completion', paymentId, txid);
              fetch('/api/pi/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentId, txid, email })
              }).catch(err => console.warn('Pi completion request notice', err));

              localStorage.setItem('sirwise_paid', 'true');
              localStorage.setItem('academy_unlocked', 'true');
              localStorage.setItem('payment_verified', 'true');
              localStorage.setItem('payment_method', 'Pi GCV $314,159');

              let orders = JSON.parse(localStorage.getItem('live_orders') || '[]');
              orders.unshift({
                id: paymentId || 'PI-' + Date.now(),
                customer: email.split('@')[0],
                email: email,
                country: 'Pi Network',
                product: 'Sirwise Academy - Pi Payment',
                amount: '0.000159 Pi ($49.99 GCV)',
                status: 'VERIFIED',
                verified: 'VERIFIED',
                txid: txid,
                date: new Date().toLocaleDateString()
              });
              localStorage.setItem('live_orders', JSON.stringify(orders));

              if (window.unlockAcademy) window.unlockAcademy();

              alert('✅ Pi Payment Verified! TxID: ' + txid + ' - Sirwise AI Academy Unlocked at GCV $314,159!');
              window.location.hash = 'academy';
              setTimeout(() => location.reload(), 1000);
            },
            onCancel: function(paymentId) {
              console.log('Payment Cancelled', paymentId);
              alert('Pi Payment Cancelled by User.');
            },
            onError: function(error, payment) {
              console.error('Payment Error', error, payment);
              alert('Pi Payment Notice: Ensure your Pi Browser is connected to Pi Testnet!');
            }
          });
        } catch (e) {
          console.error('Pi.createPayment error', e);
          alert('Pay with Pi notice: Please open https://www.gasv.store in Pi Browser App - Pi Testnet mode!');
        }
      }

      window.loginWithPi = loginWithPi;
      window.payWithPi = payWithPi;

      // Global event listener to attach interactive behavior to all Pi login buttons
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.querySelectorAll('button').forEach(function(b) {
            if (b.textContent && b.textContent.includes('Login with Pi')) {
              b.id = 'loginWithPiBtn';
              b.onclick = loginWithPi;
              b.style.pointerEvents = 'auto';
              b.style.cursor = 'pointer';
              b.style.zIndex = '99999';
              b.style.position = 'relative';
            }
          });
        }, 500);

        const isPiBrowser = navigator.userAgent.includes('PiBrowser') || (typeof Pi !== 'undefined' && window.location.search.includes('pi'));
        if (isPiBrowser) {
          console.log("⚡ Pi Browser Context Detected! Prioritizing Pi SDK Auth & Payment.");
          document.body.classList.add('pi-browser-context');
        }
      });
